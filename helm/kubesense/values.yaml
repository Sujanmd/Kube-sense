# Default values for kubesense Helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Allows overriding the namespace to deploy into (defaults to .Release.Namespace)
  namespace: ""

# Set to true if you want the chart to render a Namespace manifest (use false if using helm --create-namespace)
createNamespace: false

# Backend service (FastAPI + AI/ML RCA & Forecasting Engine)
backend:
  replicaCount: 1

  image:
    repository: kubesense-backend
    tag: latest
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: "backend-sa"

  rbac:
    create: true
    roleName: "backend-reader"

  service:
    name: "backend-service"
    type: NodePort
    port: 8000
    targetPort: 8000
    nodePort: 30800

  hostAliases:
    - ip: "192.168.49.1"
      hostnames:
        - "host.minikube.internal"
        - "host.k3d.internal"

  env:
    ollamaUrl: "http://host.k3d.internal:11434"
    logLevel: "info"

  probes:
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Frontend service (React + Vite SPA served via Nginx reverse proxy)
frontend:
  replicaCount: 1

  image:
    repository: kubesense-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    name: "frontend-service"
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

  probes:
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# PostgreSQL Database
postgresql:
  enabled: true
  replicaCount: 1

  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent

  service:
    name: "postgres-service"
    type: ClusterIP
    port: 5432
    targetPort: 5432

  auth:
    database: "kubesense"
    username: "postgres"
    password: "kubesense_secure_pass"

  persistence:
    enabled: true
    claimName: "postgres-pvc"
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    mountPath: /var/lib/postgresql/data
    storageClassName: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Prometheus Monitoring
prometheus:
  enabled: true
  replicaCount: 1

  image:
    repository: prom/prometheus
    tag: "v2.45.0"
    pullPolicy: IfNotPresent

  service:
    name: "prometheus"
    type: ClusterIP
    port: 9090
    targetPort: 9090

  serviceAccount:
    create: true
    name: "prometheus"

  rbac:
    create: true
    clusterRoleName: "prometheus"

  scrapeInterval: 15s
  evaluationInterval: 15s

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
