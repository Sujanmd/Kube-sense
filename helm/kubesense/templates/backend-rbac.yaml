{{- if .Values.backend.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backend.serviceAccount.name }}
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.backend.rbac.roleName }}
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: backend
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.backend.rbac.roleName }}-binding
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.backend.rbac.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccount.name }}
    namespace: {{ include "kubesense.namespace" . }}
{{- end }}
