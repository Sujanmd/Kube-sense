apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: postgres
data:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_HOST: {{ .Values.postgresql.service.name | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
