{{- if and .Values.prometheus.enabled .Values.prometheus.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.prometheus.serviceAccount.name }}
  namespace: {{ include "kubesense.namespace" . }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.prometheus.rbac.clusterRoleName }}
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.prometheus.rbac.clusterRoleName }}-binding
  labels:
    {{- include "kubesense.labels" . | nindent 4 }}
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prometheus.rbac.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.prometheus.serviceAccount.name }}
    namespace: {{ include "kubesense.namespace" . }}
{{- end }}
